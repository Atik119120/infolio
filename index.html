<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1733" />

    <title>Infolio — Build Your Professional Portfolio in Minutes</title>
    <meta name="description" content="Infolio helps freelancers, designers, photographers, and professionals create a stunning personal portfolio website in minutes. Pick a theme, add your work, and publish on your own subdomain or custom domain." />
    <meta name="keywords" content="portfolio builder, personal portfolio, freelancer portfolio, designer portfolio, photographer portfolio, online resume, CV website, custom domain portfolio, Infolio" />
    <meta name="author" content="Infolio" />
    <link rel="canonical" href="https://infolio.online/" />

    <!-- Favicons / App icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Infolio" />
    <meta property="og:title" content="Infolio — Build Your Professional Portfolio in Minutes" />
    <meta property="og:description" content="Pick a theme, add your work, and publish a stunning personal portfolio in minutes — on your own subdomain or custom domain." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://infolio.online/" />
    <meta property="og:image" content="https://infolio.online/og-image.jpg" />
    <meta property="og:image:width" content="1216" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Infolio — Build your professional portfolio in minutes" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Infolio — Build Your Professional Portfolio in Minutes" />
    <meta name="twitter:description" content="Pick a theme, add your work, and publish a stunning personal portfolio in minutes." />
    <meta name="twitter:image" content="https://infolio.online/og-image.jpg" />
    <meta name="twitter:image:alt" content="Infolio — Build your professional portfolio in minutes" />

    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Infolio",
          "url": "https://infolio.online/",
          "logo": "https://infolio.online/apple-touch-icon.png"
        },
        {
          "@type": "WebSite",
          "name": "Infolio",
          "url": "https://infolio.online/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://infolio.online/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
